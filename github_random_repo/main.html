<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Github Random Respository</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class ="container">
            <header>
                <h1>GitHub Repository Finder</h1>
            </header>
            <select id="options" class="options">
                <option value="">Select a Language</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="typescript">TypeScript</option>
                <option value="c++">C++</option>
                <option value="go">Go</option>
                <option value="ruby">Ruby</option>
                <option value="php">PHP</option>
            </select>
            <div id="description">
                <div class="state empty">Please select a language</div>
            </div>
            <button id="refresh-btn">Refresh</button>
        </div>
        <script>
            const language = document.getElementById("options");
            const content = document.getElementById("description");
            const refreshBtn = document.getElementById("refresh-btn");

            function showEmpty(){
              content.innerHTML=`<div class="state">Please select a language</div>`;
              refreshBtn.classList.add("hidden")
              ;
            }

            function showLoading(){
              content.classList.remove("error-state");
              content.innerHTML=`<div class="state">Loading, please wait..</div>`;
              refreshBtn.classList.add("hidden");
              refreshBtn.classList.remove("retry");
              refreshBtn.innerHTML = "Refresh";
            }

            function showError(){
              content.innerHTML=`<div class="error">Error fetching repositories</div>`;
              content.classList.add("error-state");
              refreshBtn.classList.add("retry");
              refreshBtn.classList.remove("hidden");
              refreshBtn.innerHTML=`Click to retry`;
            }

            function showRepository(repo){
              content.classList.remove("error-state");
              content.innerHTML=`
                <div class="repo-card">
                    <h2> ${repo.name}</h2>
                    <p class="detail">${repo.description}</p>
                    <div class="info">
                        <span>🟡 ${repo.language}</span>
                        <span>⭐ ${repo.stargazers_count} </span>
                        <span> 🍴 ${repo.forks_count} </span>
                        <span> ⚪ ${repo.open_issues_count} </span>
                    </div>
                </div>
                `;
              refreshBtn.classList.remove("hidden");
              refreshBtn.classList.remove("retry");
              refreshBtn.innerHTML="Refresh";
            }

            async function fetchRepository(){
                const lang = language.value;
                if (!lang){
                    showEmpty();
                    return;
                }

                showLoading();

                try{
                    const url = `https://api.github.com/search/repositories?q=language:${lang}&sort=stars&order=desc&per_page=100`;
                    const response = await fetch(url);
                    if(!response.ok){
                      throw new Error();
                    }
                    const data = await response.json();
                    const repos = data.items;
                    const randomRepo = repos[Math.floor(Math.random()*repos.length)];
                    showRepository(randomRepo);
                } catch{
                    showError();
                }
            }
            language.addEventListener("change",fetchRepository);
            refreshBtn.addEventListener("click",fetchRepository);
            showEmpty();
        </script>
    </body>
</html>
