<!DOCTYPE html>
<html>
    <head>
        <title>Task tracker</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h2>Task Tracker</h2>
            <div class="input">
                <input id="input-space" type="text" placeholder="Start writing and press enter to create task">
                <button id="enter-btn">Add</button>
            </div>
            <ul id="taskList"></ul>
        </div>
        <script>
            const input = document.getElementById("input-space");
            const enter = document.getElementById("enter-btn");
            const taskList = document.getElementById("taskList");

            let tasks =[];

            function addTask(){
              const text = input.value.trim();
              if(text === "") return;
              tasks.push({
                description: text,
                completed: false
              });
              renderTasks();
              input.value ="";
            }

            enter.addEventListener("click", addTask);

            function renderTasks(){
              taskList.innerHTML="";
              const sortedTasks = [
                ...tasks.filter(task => !task.completed),
                ...tasks.filter(task => task.completed)
              ];
              sortedTasks.forEach(task =>{
                const li = document.createElement("li");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;

                const text = document.createElement("span");
                text.textContent = task.description;

                if (task.completed){
                  text.style.textDecoration ="line-through";
                  text.style.color ="gray";
                }
                checkbox.addEventListener("change",()=>{
                  task.completed = checkbox.checked;
                  renderTasks();
                });

                const deleteBtn = document.createElement("button");
                deleteBtn.classList.add("deleteBtn");
                deleteBtn.textContent="🗑";
                deleteBtn.addEventListener("click",() =>{
                  tasks = tasks.filter(t => t !==task);
                  renderTasks();
                });
                taskList.appendChild(li);
                li.appendChild(checkbox);
                li.appendChild(text);
                li.appendChild(deleteBtn);
              })
            }
        </script>
    </body>
</html>
